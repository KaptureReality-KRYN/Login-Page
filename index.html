<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kapture Reality - Employee Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #1e293b;
      overflow: hidden;
      position: relative;
    }

    /* Modern Soft Green Ambient Glow Elements */
    .bg-shape-1 {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.18) 0%, rgba(255, 255, 255, 0) 70%);
      border-radius: 50%;
      z-index: 0;
    }

    .bg-shape-2 {
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(5, 150, 105, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
      border-radius: 50%;
      z-index: 0;
    }

    /* Grid Overlay Pattern */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(16, 185, 129, 0.12) 1px, transparent 1px);
      background-size: 24px 24px;
      z-index: 0;
    }

    .login-container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 48px 40px;
      border-radius: 28px;
      box-shadow: 
        0 20px 40px -15px rgba(16, 185, 129, 0.08),
        0 0 15px rgba(0, 0, 0, 0.03),
        inset 0 0 0 1px rgba(255, 255, 255, 0.9);
      width: 100%;
      max-width: 410px;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .logo-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px auto;
      background: #ffffff;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.15);
    }

    .company-logo { 
      max-width: 52px; 
      max-height: 52px; 
      object-fit: contain;
    }

    h2 { 
      color: #0f172a; 
      font-size: 24px; 
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px; 
    }

    p.subtitle { 
      color: #64748b; 
      font-size: 14px; 
      font-weight: 500;
      margin-bottom: 32px; 
    }

    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .input-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-field {
      width: 100%;
      padding: 14px 18px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 500;
      color: #0f172a;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field::placeholder { 
      color: #94a3b8; 
    }

    .input-field:focus { 
      border-color: #10b981; 
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
    }

    .btn-login {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      transform: translateY(-2px);
      box-shadow: 0 14px 24px -5px rgba(16, 185, 129, 0.5);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      background: #cbd5e1;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    #error-msg { 
      color: #e11d48; 
      background: #ffe4e6;
      border: 1px solid #fecdd3;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px; 
      font-weight: 600;
      margin-top: 20px; 
      display: none; 
      animation: fadeIn 0.3s ease;
    }

    #success-msg {
      color: #047857;
      background: #d1fae5;
      border: 1px solid #a7f3d0;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 20px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="bg-shape-1"></div>
<div class="bg-shape-2"></div>
<div class="bg-grid"></div>

<div class="login-container">
  <div class="logo-wrapper">
    <img src="KRYN.jpeg" alt="Kapture Reality Logo" class="company-logo">
  </div>
  <h2>Kapture Reality</h2>
  <p class="subtitle">Startup Attendance Portal</p>
  
  <div class="input-group">
    <label class="input-label" for="username">Username</label>
    <input type="text" id="username" class="input-field" placeholder="Enter your username" autocomplete="off">
  </div>
  <div class="input-group">
    <label class="input-label" for="password">Password</label>
    <input type="password" id="password" class="input-field" placeholder="••••••••">
  </div>
  
  <button class="btn-login" onclick="login()">
    <span>Login & Start Shift</span>
  </button>
  
  <div id="error-msg"></div>
  <div id="success-msg"></div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4g-0ORm6Ud6WHEiE32Z8hQD-ObgGkXvCEYaQdfB1nFVZKz5xN0f5z6VsCb35xG-Jidg/exec";
  
  // REAL EXTENSION ID
  const EXTENSION_ID = "fnmojlmglahoebpfohllgefedfhhdlmd"; 

  // Enter Key Listeners
  document.getElementById("username").addEventListener("keypress", function(e) { if (e.key === "Enter") login(); });
  document.getElementById("password").addEventListener("keypress", function(e) { if (e.key === "Enter") login(); });

  function login() {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    const errorDiv = document.getElementById('error-msg');
    const successDiv = document.getElementById('success-msg');
    const loginBtn = document.querySelector('.btn-login span');
    const btnElement = document.querySelector('.btn-login');
    
    errorDiv.style.display = "none";
    successDiv.style.display = "none";

    if(!user || !pass) {
      errorDiv.innerText = "Please enter both Username and Password!";
      errorDiv.style.display = "block";
      return;
    }

    loginBtn.innerText = "Authenticating...";
    btnElement.disabled = true;

    // Google Sheets Verification
    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ username: user, password: pass, action: "LOGIN" })
    })
    .then(res => res.json())
    .then(data => {
      if (data.result === "success") {
        // Chrome Extension Communication
        if (typeof chrome !== "undefined" && chrome.runtime && chrome.runtime.sendMessage) {
          chrome.runtime.sendMessage(EXTENSION_ID, {
            action: "START_TIMER",
            username: user,
            startTime: Date.now()
          }, (response) => {
            if (chrome.runtime.lastError) {
              loginBtn.innerText = "Login & Start Shift";
              btnElement.disabled = false;
              errorDiv.innerText = "Extension Connection Failed! Check Extension ID.";
              errorDiv.style.display = "block";
            } else {
              // SUCCESS - UPDATE UI & AUTO CLOSE TAB
              loginBtn.innerText = "Shift Started!";
              successDiv.innerText = "Login Successful! Closing tab...";
              successDiv.style.display = "block";
              
              setTimeout(() => {
                // Try closing directly
                window.close();
  
                // Script-opened window trick for stubborn browsers
                window.open('', '_self', '');
                window.close();
              }, 1200);
            }
          });
        } else {
          loginBtn.innerText = "Login & Start Shift";
          btnElement.disabled = false;
          errorDiv.innerText = "Chrome Extension Not Detected!";
          errorDiv.style.display = "block";
        }
      } else {
        loginBtn.innerText = "Login & Start Shift";
        btnElement.disabled = false;
        errorDiv.innerText = data.message || "Invalid Username or Password!";
        errorDiv.style.display = "block";
      }
    })
    .catch(err => {
      console.error(err);
      loginBtn.innerText = "Login & Start Shift";
      btnElement.disabled = false;
      errorDiv.innerText = "Server Connection Error!";
      errorDiv.style.display = "block";
    });
  }
</script>

</body>
</html>
